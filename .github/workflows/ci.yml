name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tests:
    name: Release tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            g++ \
            ninja-build

      - name: Configure Release build
        run: |
          cmake \
            -S . \
            -B build-release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHTPSTE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-release --parallel

      - name: Run tests
        run: ctest --test-dir build-release --output-on-failure

  asan-ubsan:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            cmake \
            ninja-build

      - name: Configure sanitized build
        run: |
          cmake \
            -S . \
            -B build-sanitized \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHTPSTE_BUILD_TESTS=ON \
            -DHTPSTE_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-sanitized --parallel

      - name: Run tests under sanitizers
        run: ctest --test-dir build-sanitized --output-on-failure

  docker:
    name: Docker image
    needs:
      - release-tests
      - asan-ubsan
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --tag htpste:ci-${{ github.sha }} .

      - name: Run simulation smoke test
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD/tests/fixtures/market_model.json",target=/data/market_model.json,readonly \
            htpste:ci-${{ github.sha }} \
            --market-model /data/market_model.json \
            --scenarios 16 \
            --seed 42 \
            --threads 2
